# Only allow WebSocket upgrades, reject all other protocol upgrades (including H2C)
map $http_upgrade $connection_upgrade {
  default close;
  websocket upgrade;
}

# Public id-api routes reachable through this front (KS-24i). Everything else is 404 here, so the service-to-service
# routes of id-api (basic auth, /proxy/*) are not exposed. Keep in sync with helm-chart/values.yaml ingress.idApiPublicAllowlist.
map $uri $id_api_public {
  default 0;
  "~^/test/ping/?$" 1;
  "~^/auth/?$" 1;
  "~^/auth_providers/?$" 1;
  "~^/sign_in(/|$)" 1;
  "~^/relogin/?$" 1;
  "~^/authorise(/|$)" 1;
  "~^/oauth/token/?$" 1;
  "~^/logout/?$" 1;
  "~^/logoff(/|$)" 1;
  "~^/subscribe/?$" 1;
  "~^/removeConfirmCode/?$" 1;
  "~^/user/info/?$" 1;
  "~^/user/jwt/?$" 1;
  "~^/user/logout_other_sessions/?$" 1;
  "~^/user/password/forgot/?$" 1;
  "~^/user/password/reset/?$" 1;
  "~^/user/info/email/send/?$" 1;
  "~^/user/info/email/set/?$" 1;
  "~^/user/info/email/check_email_confirmation_code/?$" 1;
  "~^/user/info/setValidPhone/?$" 1;
  "~^/user/info/phone/send/?$" 1;
  "~^/user/info/phone/confirm/?$" 1;
  "~^/user/info/phone/check_phone_confirmation_code/?$" 1;
  "~^/sign_up/?$" 1;
  "~^/sign_up/confirmation/?$" 1;
  "~^/sign_up/confirmation/email/exist/?$" 1;
  "~^/sign_up/confirmation/email/send/?$" 1;
  "~^/sign_up/confirmation/email/verify/?$" 1;
  "~^/sign_up/confirmation/phone/exist/?$" 1;
  "~^/sign_up/confirmation/phone/send/?$" 1;
  "~^/sign_up/confirmation/phone/verify/?$" 1;
  "~^/sign_up/confirmation/phone/check_code/?$" 1;
  "~^/sign_up/confirmation/phone/check/?$" 1;
}

# Access log without the query string ($uri instead of $request): confirmation codes, emails and phones must not reach the logs.
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
  resolver 127.0.0.11 valid=10s;
  set $id_api_url http://id-api:8080;

  listen 8080;
  server_tokens off;

  error_log /dev/stderr;
  access_log /dev/stdout no_query;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src blob: 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob: http://localhost:* https://*; frame-ancestors 'self';" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/x-javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;
  client_max_body_size 100M;

  location = / {
    root /usr/share/nginx/html;
    index index.html;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    error_page 404 = @id-api;
    try_files $uri $uri/ =404;
  }

  location @id-api {
    if ($id_api_public = 0) {
      return 404;
    }

    proxy_pass $id_api_url;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host id-api:8080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
  }

  # Health check endpoint. This will be used by Kubernetes to determine if the
  # container is ready/alive.
  location = /healthz {
    return 200 'OK';
  }

  error_page 500 502 503 504 /50x.html;

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
