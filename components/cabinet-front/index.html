<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="google" content="notranslate" />
  <meta property="og:title" content="Liquio Cabinet" />
  <meta property="og:description" content="Liquio Cabinet" />
  <meta property="og:image" content="/icon-512.png" />

  <meta name="msapplication-TileColor" content="#ffffff">

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png">

  <meta name="description" content="Liquio Cabinet">
  <title>Liquio Cabinet</title>
  <style>
    #app-loader {
      align-items: center;
      background: #fff;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 2147483647;
    }

    #app-loader__spinner {
      animation: app-loader-spin 800ms linear infinite;
      border: 3px solid #e5f0ff;
      border-radius: 50%;
      border-top-color: #0068ff;
      box-sizing: border-box;
      height: 40px;
      width: 40px;
    }

    @keyframes app-loader-spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #app-loader__spinner { animation-duration: 2s; }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading application">
      <div id="app-loader__spinner" aria-hidden="true"></div>
    </div>
  </div>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
