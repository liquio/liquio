name: Publish to NPM

on:
  workflow_run:
    workflows: ['Code Quality']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory name under packages/ to publish (leave empty for all)'
        required: false
        type: string

jobs:
  detect:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any: ${{ steps.build-matrix.outputs.any }}
    steps:
      # Automatic publishing runs only for commits on main that came from a
      # merged pull request whose head branch is publish/*. Manual dispatch
      # is not restricted.
      - name: Check source branch
        id: source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HEAD_REFS=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .head.ref')
          echo "PR head branches for $HEAD_SHA: ${HEAD_REFS:-none}"
          if printf '%s\n' "$HEAD_REFS" | grep -q '^publish/'; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a merge from a publish/* branch, skipping npm publish"
          fi

      - uses: actions/checkout@v6
        if: steps.source.outputs.allowed != 'false'
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build package matrix
        id: build-matrix
        env:
          ONLY_PACKAGE: ${{ inputs.package }}
          ALLOWED: ${{ steps.source.outputs.allowed }}
        run: |
          if [ "$ALLOWED" = "false" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INCLUDES=()
          for pkg_json in packages/*/package.json; do
            dir=$(dirname "$pkg_json")
            pkg=$(basename "$dir")
            if [ -n "$ONLY_PACKAGE" ] && [ "$pkg" != "$ONLY_PACKAGE" ]; then
              continue
            fi
            name=$(node -p "require('./$pkg_json').name")
            private=$(node -p "require('./$pkg_json').private || false")
            if [ "$private" = "false" ]; then
              INCLUDES+=("{\"package\":\"$pkg\",\"name\":\"$name\"}")
            fi
          done

          if [ "${#INCLUDES[@]}" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${INCLUDES[@]}" | jq -sc '{"include": .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'packages/${{ matrix.package }}/package-lock.json'

      - name: Check if version is already published
        id: check
        working-directory: packages/${{ matrix.package }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "${{ matrix.name }}" version 2>/dev/null || true)

          if [ "$VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm ci

      - name: Build
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
