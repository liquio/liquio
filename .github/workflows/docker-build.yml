name: Build and Push Images

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service directory name under components/ to build (leave empty for all unpublished services)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  # ── Detect which services are unpublished ────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any: ${{ steps.build-matrix.outputs.any }}

    steps:
      - uses: actions/checkout@v6

      - name: Build service matrix from unpublished versions
        id: build-matrix
        env:
          FORCE_SERVICE: ${{ inputs.service }}
        run: |
          # Returns 0 (true) if ghcr.io/liquio/<svc>:<ver> already exists
          is_published() {
            local svc=$1 ver=$2
            local repo="liquio/${svc}"
            local token
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${ver}")
            [ "$status" = "200" ]
          }

          # Returns 0 (true) if the service should be built
          should_build() {
            local svc=$1
            if [ -n "$FORCE_SERVICE" ]; then
              [ "$svc" = "$FORCE_SERVICE" ] && return 0
              return 1
            fi
            local ver
            ver=$(jq -r .version "components/${svc}/package.json")
            ! is_published "$svc" "$ver" && return 0
            return 1
          }

          INCLUDES=()

          # Plain services (no extra build context)
          for svc in admin-api cabinet-api event external-reader filestorage \
                     gateway id-api id-front manager notification \
                     pdf-generator register sign-tool task persist-link; do
            if should_build "$svc"; then
              INCLUDES+=("{\"service\":\"$svc\"}")
            fi
          done

          # Front services that need front-core as an additional build context
          for svc in admin-front cabinet-front; do
            if should_build "$svc"; then
              INCLUDES+=("{\"service\":\"$svc\",\"build-contexts\":\"core=./packages/front-core\"}")
            fi
          done

          if [ "${#INCLUDES[@]}" -eq 0 ]; then
            echo "No unpublished service versions — skipping build."
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${INCLUDES[@]}" | jq -sc '{"include": .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build and push the unpublished services ──────────────────────────────
  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read service version
        id: pkg
        run: |
          VERSION=$(jq -r .version components/${{ matrix.service }}/package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./components/${{ matrix.service }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.pkg.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
