name: E2E Tests

# Component e2e suites (components/*/tests). Each one boots the NestJS/Express app
# in-process and starts its backing services (Postgres, Redis, RabbitMQ, Dex,
# OpenLDAP) with testcontainers against the runner's Docker daemon.
# Playwright suites in test/ are not covered here.

on:
  schedule:
    - cron: '0 0 * * *' # daily, 00:00 UTC
  workflow_dispatch:
    inputs:
      components:
        description: 'Comma-separated components to run (empty = all), e.g. "task,id-api"'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build component matrix
        id: build
        env:
          FILTER: ${{ inputs.components }}
        run: |
          # images: pre-pulled before the run so a slow/rate-limited Docker Hub pull
          # fails loudly here instead of as a testcontainers startup timeout.
          ALL='[
            {"name":"admin-api",       "images":"postgres:16 redis:8"},
            {"name":"event",           "images":"postgres:16 redis:8"},
            {"name":"external-reader", "images":""},
            {"name":"filestorage",     "images":"postgres:16"},
            {"name":"gateway",         "images":"postgres:16 rabbitmq:3-management"},
            {"name":"id-api",          "images":"postgres:16 redis:8 dexidp/dex:v2.45.0 bitnamilegacy/openldap:2.6.10"},
            {"name":"manager",         "images":"postgres:16 rabbitmq:3-management"},
            {"name":"notification",    "images":"postgres:16"},
            {"name":"pdf-generator",   "images":""},
            {"name":"persist-link",    "images":"postgres:16"},
            {"name":"register",        "images":"postgres:16 redis:8"},
            {"name":"sign-tool",       "images":""},
            {"name":"task",            "images":"postgres:16 redis:8"}
          ]'
          if [ -n "$FILTER" ]; then
            WANT=$(echo "$FILTER" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
            MATRIX=$(echo "$ALL" | jq -c --argjson want "$WANT" '{include: map(select(.name as $n | $want | index($n)))}')
          else
            MATRIX=$(echo "$ALL" | jq -c '{include: .}')
          fi
          if [ "$(echo "$MATRIX" | jq '.include | length')" -eq 0 ]; then
            echo "::error::No components matched '$FILTER'"
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    name: e2e-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: components/${{ matrix.name }}
    steps:
      # Full checkout: gateway/admin-api/event read manager's migrations and
      # fixtures, notification reads config-templates/.
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'components/${{ matrix.name }}/package-lock.json'

      - name: Pre-pull container images
        if: matrix.images != ''
        run: |
          for img in ${{ matrix.images }}; do
            for attempt in 1 2 3; do
              docker pull -q "$img" && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 10))
            done
          done

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run ci:e2e

      - name: Dump leftover containers on failure
        if: failure()
        run: docker ps -a --format 'table {{.Image}}\t{{.Status}}\t{{.Names}}'
