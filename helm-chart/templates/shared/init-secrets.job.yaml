{{- if eq (include "liquio.secrets.create" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "liquio.fullname" . }}-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    ignore-check.kube-linter.io/no-read-only-root-fs: "init-secrets requires filesystem writes for apk add"
    ignore-check.kube-linter.io/run-as-non-root: "init-secrets requires root to run apk add"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "liquio.labels" . | nindent 8 }}
        app.kubernetes.io/component: init-secrets
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "liquio.fullname" . }}-init-secrets
      containers:
        - name: init-secrets
          image: alpine/k8s:1.34.7
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              apk add --no-cache openssl jq >/dev/null

              NAMESPACE={{ .Release.Namespace | quote }}
              TMP_DIR="$(mktemp -d)"
              trap 'rm -rf "$TMP_DIR"' EXIT

              POSTGRES_PASSWORD="$(openssl rand -base64 32)"
              # Use URL-safe password material for AMQP URL embedding.
              RABBITMQ_PASSWORD="$(openssl rand -hex 24)"
              OAUTH_SECRET="$(openssl rand -base64 32)"
              JWT_SECRET="$(openssl rand -base64 32)"
              REGISTER_KEY="$(openssl rand -base64 32)"
              REGISTER_TOKEN="Basic $(printf "register:%s" "$(openssl rand -base64 32)" | base64 | tr -d '\n')"
              READER_PASSWORD="$(openssl rand -base64 32)"
              READER_TOKEN="Basic $(printf "external-reader:%s" "$READER_PASSWORD" | base64 | tr -d '\n')"
              PDF_GENERATOR_TOKEN="Basic $(printf "pdf-generator:%s" "$(openssl rand -base64 32)" | base64 | tr -d '\n')"
              FILESTORAGE_TOKEN="Basic $(printf "filestorage:%s" "$(openssl rand -base64 32)" | base64 | tr -d '\n')"
              # Basic token admin-api uses to call task; the same value is added to task basic_auth.json.
              TASK_BASIC_TOKEN="Basic $(printf "admin-api:%s" "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')" | base64 | tr -d '\n')"
              # Basic token event uses to call task (`external_bpmn.test`), so `basic_auth.scopedRoutes` can name user `event`.
              EVENT_TASK_TOKEN="Basic $(printf "event:%s" "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')" | base64 | tr -d '\n')"
              # Named id-api `basic_auth.clients`, one per in-cluster caller (KS-24). Callers send `Basic base64(name:secret)`.
              # id-api stores only the SHA-256 of each secret; the callers get the Basic token. admin-api is not listed: it still
              # uses the legacy shared secret (`oauth.secret_key`) because it disables 2FA and sets roles through id-api.
              ID_CLIENT_TASK_SECRET="$(openssl rand -hex 32)"
              ID_CLIENT_CABINET_API_SECRET="$(openssl rand -hex 32)"
              ID_CLIENT_EVENT_SECRET="$(openssl rand -hex 32)"
              ID_CLIENT_NOTIFICATION_SECRET="$(openssl rand -hex 32)"
              ID_CLIENT_TASK_TOKEN="Basic $(printf "task:%s" "$ID_CLIENT_TASK_SECRET" | base64 | tr -d '\n')"
              ID_CLIENT_CABINET_API_TOKEN="Basic $(printf "cabinet-api:%s" "$ID_CLIENT_CABINET_API_SECRET" | base64 | tr -d '\n')"
              ID_CLIENT_EVENT_TOKEN="Basic $(printf "event:%s" "$ID_CLIENT_EVENT_SECRET" | base64 | tr -d '\n')"
              ID_CLIENT_NOTIFICATION_TOKEN="Basic $(printf "notification:%s" "$ID_CLIENT_NOTIFICATION_SECRET" | base64 | tr -d '\n')"
              ID_CLIENT_TASK_HASH="$(printf '%s' "$ID_CLIENT_TASK_SECRET" | openssl dgst -sha256 | awk '{print $NF}')"
              ID_CLIENT_CABINET_API_HASH="$(printf '%s' "$ID_CLIENT_CABINET_API_SECRET" | openssl dgst -sha256 | awk '{print $NF}')"
              ID_CLIENT_EVENT_HASH="$(printf '%s' "$ID_CLIENT_EVENT_SECRET" | openssl dgst -sha256 | awk '{print $NF}')"
              ID_CLIENT_NOTIFICATION_HASH="$(printf '%s' "$ID_CLIENT_NOTIFICATION_SECRET" | openssl dgst -sha256 | awk '{print $NF}')"
              NOTIFY_LOGIN="notification"
              NOTIFY_PASSWORD="$(openssl rand -base64 32)"
              NOTIFY_TOKEN="Basic $(printf "%s:%s" "$NOTIFY_LOGIN" "$NOTIFY_PASSWORD" | base64 | tr -d '\n')"
              # Tokens for the x-monitoring-token header of the manager, gateway and event diagnostic routes (SE-3930 BM-08/GW-07/EV-09).
              MONITORING_MANAGER_TOKEN="$(openssl rand -hex 32)"
              MONITORING_GATEWAY_TOKEN="$(openssl rand -hex 32)"
              MONITORING_EVENT_TOKEN="$(openssl rand -hex 32)"

              kubectl create secret generic {{ printf "%s-infra-secrets" (include "liquio.fullname" .) }} \
                --namespace "$NAMESPACE" \
                --from-literal=postgresql-password="$POSTGRES_PASSWORD" \
                --from-literal=rabbitmq-password="$RABBITMQ_PASSWORD"

              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout "$TMP_DIR/ca.key" \
                -out "$TMP_DIR/ca.crt" \
                -subj "/C=UA/L=Kyiv/O=Liquio/OU=Development/CN=Liquio"

              kubectl create secret generic {{ .Values.secrets.existingSecrets.caCerts | default (printf "%s-ca-certs" (include "liquio.fullname" .)) }} \
                --namespace "$NAMESPACE" \
                --from-file=ca.crt="$TMP_DIR/ca.crt" \
                --from-file=ca.key="$TMP_DIR/ca.key"

              SIGN_TOOL_X509_JSON="$(jq -cn --rawfile ca "$TMP_DIR/ca.crt" '{caCerts: [$ca]}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "sign-tool") }} \
                --namespace "$NAMESPACE" \
                --from-literal=x509.json="$SIGN_TOOL_X509_JSON"

              RABBITMQ_CONNECTION="amqp://{{ .Values.config.rabbitmq.username }}:$RABBITMQ_PASSWORD@{{ include "liquio.rabbitmq.host" . }}:{{ .Values.config.rabbitmq.port }}/"

              ADMIN_API_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              ADMIN_API_MQ_JSON="$(jq -cn --arg amqp "$RABBITMQ_CONNECTION" '{amqpConnection: $amqp}')"
              ADMIN_API_AUTH_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" --arg jwt "$JWT_SECRET" '{basicAuthToken: $oauth, clientSecret: $oauth, jwtSecret: $jwt}')"
              ADMIN_API_FILESTORAGE_JSON="$(jq -cn --arg token "$FILESTORAGE_TOKEN" '{token: $token}')"
              ADMIN_API_REGISTER_JSON="$(jq -cn --arg token "$REGISTER_TOKEN" '{token: $token}')"
              ADMIN_API_SERVER_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" --arg jwt "$JWT_SECRET" '{crypto: {iv: $oauth, password: $jwt}, token: $oauth}')"
              ADMIN_API_ELASTIC_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" '{headers: {Authorization: ("Basic " + $oauth)}}')"
              ADMIN_API_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{user: $user, password: $password}')"
              ADMIN_API_SYSTEM_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}}')"
              ADMIN_API_SIGN_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" '{token: $oauth}')"
              ADMIN_API_TASK_JSON="$(jq -cn --arg token "$TASK_BASIC_TOKEN" '{token: $token}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "admin-api") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$ADMIN_API_DB_JSON" \
                --from-literal=message_queue.json="$ADMIN_API_MQ_JSON" \
                --from-literal=auth.json="$ADMIN_API_AUTH_JSON" \
                --from-literal=filestorage.json="$ADMIN_API_FILESTORAGE_JSON" \
                --from-literal=register.json="$ADMIN_API_REGISTER_JSON" \
                --from-literal=server.json="$ADMIN_API_SERVER_JSON" \
                --from-literal=elastic.json="$ADMIN_API_ELASTIC_JSON" \
                --from-literal=notifier.json="$ADMIN_API_NOTIFIER_JSON" \
                --from-literal=system_notifier.json="$ADMIN_API_SYSTEM_NOTIFIER_JSON" \
                --from-literal=sign.json="$ADMIN_API_SIGN_JSON" \
                --from-literal=task.json="$ADMIN_API_TASK_JSON"

              CABINET_API_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              CABINET_API_AUTH_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" --arg jwt "$JWT_SECRET" --arg idToken "$ID_CLIENT_CABINET_API_TOKEN" '{LiquioId: {clientSecret: $oauth, basicAuthToken: $idToken}, jwtSecret: $jwt}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "cabinet-api") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$CABINET_API_DB_JSON" \
                --from-literal=auth.json="$CABINET_API_AUTH_JSON"

              ID_CONFIG_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" --arg oauth "$OAUTH_SECRET" --arg jwt "$JWT_SECRET" --arg notifyAuth "$NOTIFY_TOKEN" \
                --arg taskHash "$ID_CLIENT_TASK_HASH" --arg cabinetHash "$ID_CLIENT_CABINET_API_HASH" --arg eventHash "$ID_CLIENT_EVENT_HASH" --arg notificationHash "$ID_CLIENT_NOTIFICATION_HASH" \
                '{production: {db: {password: $password}, session: {secret_key: $oauth}, jwt: {secret: $jwt}, oauth: {secret_key: [$oauth]}, notify: {authorization: $notifyAuth}, basic_auth: {clients: [
                  {name: "task", secret_hash: $taskHash, scopes: ["user:read", "user:write"]},
                  {name: "cabinet-api", secret_hash: $cabinetHash, scopes: ["totp"]},
                  {name: "event", secret_hash: $eventHash, scopes: ["user:read", "user:write"]},
                  {name: "notification", secret_hash: $notificationHash, scopes: ["user:read"]}
                ]}}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "id") }} \
                --namespace "$NAMESPACE" \
                --from-literal=config.json="$ID_CONFIG_JSON"

              EVENT_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              EVENT_MQ_JSON="$(jq -cn --arg amqp "$RABBITMQ_CONNECTION" '{amqpConnection: $amqp}')"
              EVENT_FILESTORAGE_JSON="$(jq -cn --arg token "$FILESTORAGE_TOKEN" '{token: $token}')"
              EVENT_REQUESTER_JSON="$(jq -cn --arg token "$REGISTER_TOKEN" '{registers: {token: $token}}')"
              EVENT_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}, sms: {user: $user, password: $password}}')"
              EVENT_SYSTEM_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}}')"

              EVENT_USER_JSON="$(jq -cn --arg token "$ID_CLIENT_EVENT_TOKEN" '{LiquioId: {basicAuthToken: $token}}')"
              EVENT_EXTERNAL_BPMN_JSON="$(jq -cn --arg token "$EVENT_TASK_TOKEN" '{test: {token: $token}}')"

              EVENT_SERVER_JSON="$(jq -cn --arg token "$MONITORING_EVENT_TOKEN" '{monitoring: {isEnabled: true, token: $token}}')"
              # Event pings manager's diagnostic route with manager's token.
              EVENT_PING_JSON="$(jq -cn --arg token "$MONITORING_MANAGER_TOKEN" '{manager: {monitoringToken: $token}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$EVENT_DB_JSON" \
                --from-literal=user.json="$EVENT_USER_JSON" \
                --from-literal=external_bpmn.json="$EVENT_EXTERNAL_BPMN_JSON" \
                --from-literal=message_queue.json="$EVENT_MQ_JSON" \
                --from-literal=filestorage.json="$EVENT_FILESTORAGE_JSON" \
                --from-literal=requester.json="$EVENT_REQUESTER_JSON" \
                --from-literal=notifier.json="$EVENT_NOTIFIER_JSON" \
                --from-literal=system_notifier.json="$EVENT_SYSTEM_NOTIFIER_JSON" \
                --from-literal=server.json="$EVENT_SERVER_JSON" \
                --from-literal=ping.json="$EVENT_PING_JSON"

              EXTERNAL_READER_AUTH_JSON="$(jq -cn --arg token "external-reader:$READER_PASSWORD" '{basicAuthTokens: [$token]}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "external-reader") }} \
                --namespace "$NAMESPACE" \
                --from-literal=auth.json="$EXTERNAL_READER_AUTH_JSON"

              PDF_GENERATOR_AUTH_JSON="$(jq -cn --arg token "$PDF_GENERATOR_TOKEN" '{basicAuthTokens: [$token]}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "pdf-generator") }} \
                --namespace "$NAMESPACE" \
                --from-literal=auth.json="$PDF_GENERATOR_AUTH_JSON"

              FILESTORAGE_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              FILESTORAGE_AUTH_JSON="$(jq -cn --arg token "$FILESTORAGE_TOKEN" '{tokens: [$token]}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "filestorage") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$FILESTORAGE_DB_JSON" \
                --from-literal=auth.json="$FILESTORAGE_AUTH_JSON"

              GATEWAY_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              GATEWAY_MQ_JSON="$(jq -cn --arg amqp "$RABBITMQ_CONNECTION" '{amqpConnection: $amqp}')"
              GATEWAY_SYSTEM_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}}')"

              GATEWAY_SERVER_JSON="$(jq -cn --arg token "$MONITORING_GATEWAY_TOKEN" '{monitoring: {isEnabled: true, token: $token}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "gateway") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$GATEWAY_DB_JSON" \
                --from-literal=message_queue.json="$GATEWAY_MQ_JSON" \
                --from-literal=system_notifier.json="$GATEWAY_SYSTEM_NOTIFIER_JSON" \
                --from-literal=server.json="$GATEWAY_SERVER_JSON"

              MANAGER_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              MANAGER_MQ_JSON="$(jq -cn --arg amqp "$RABBITMQ_CONNECTION" '{amqpConnection: $amqp}')"
              MANAGER_SYSTEM_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}}')"

              MANAGER_SERVER_JSON="$(jq -cn --arg token "$MONITORING_MANAGER_TOKEN" '{monitoring: {isEnabled: true, token: $token}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "manager") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$MANAGER_DB_JSON" \
                --from-literal=message_queue.json="$MANAGER_MQ_JSON" \
                --from-literal=system_notifier.json="$MANAGER_SYSTEM_NOTIFIER_JSON" \
                --from-literal=server.json="$MANAGER_SERVER_JSON"

              # Plain tokens for whoever scrapes the diagnostic routes (header `x-monitoring-token`).
              kubectl create secret generic {{ include "liquio.monitoringSecret.name" . }} \
                --namespace "$NAMESPACE" \
                --from-literal=manager="$MONITORING_MANAGER_TOKEN" \
                --from-literal=gateway="$MONITORING_GATEWAY_TOKEN" \
                --from-literal=event="$MONITORING_EVENT_TOKEN"

              NOTIFICATION_CONFIG_JSON="$(jq -cn --arg dbPassword "$POSTGRES_PASSWORD" --arg user "$NOTIFY_LOGIN" --arg notifyPassword "$NOTIFY_PASSWORD" --arg idToken "$ID_CLIENT_NOTIFICATION_TOKEN" '{production: {password: $dbPassword, db: {password: $dbPassword}, authorization: {list: [{user: $user, password: $notifyPassword}]}, auth_server: {basicAuthToken: $idToken}}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "notification") }} \
                --namespace "$NAMESPACE" \
                --from-literal=config.json="$NOTIFICATION_CONFIG_JSON"

              REGISTER_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              REGISTER_ENCRYPTION_JSON="$(jq -cn --arg key "$REGISTER_KEY" '{key: $key}')"
              REGISTER_AUTH_JSON="$(jq -cn --arg token "$REGISTER_TOKEN" '{tokens: [$token]}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "register") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$REGISTER_DB_JSON" \
                --from-literal=encryption.json="$REGISTER_ENCRYPTION_JSON" \
                --from-literal=auth.json="$REGISTER_AUTH_JSON"

              TASK_DB_JSON="$(jq -cn --arg password "$POSTGRES_PASSWORD" '{password: $password}')"
              TASK_MQ_JSON="$(jq -cn --arg amqp "$RABBITMQ_CONNECTION" '{amqpConnection: $amqp}')"
              TASK_AUTH_JSON="$(jq -cn --arg oauth "$OAUTH_SECRET" --arg jwt "$JWT_SECRET" --arg idToken "$ID_CLIENT_TASK_TOKEN" '{LiquioId: {clientSecret: $oauth, basicAuthToken: $idToken}, jwtSecret: $jwt}')"
              TASK_REGISTER_JSON="$(jq -cn --arg token "$REGISTER_TOKEN" '{token: $token}')"
              TASK_EXTERNAL_READER_JSON="$(jq -cn --arg token "$READER_TOKEN" '{basicAuthToken: $token}')"
              TASK_FILESTORAGE_JSON="$(jq -cn --arg token "$FILESTORAGE_TOKEN" '{token: $token}')"
              TASK_STORAGE_JSON="$(jq -cn --arg token "$FILESTORAGE_TOKEN" '{FileStorage: {token: $token}}')"
              TASK_PDF_GENERATOR_JSON="$(jq -cn --arg token "$PDF_GENERATOR_TOKEN" --arg url "http://{{ include "liquio.fullname" . }}-pdf-generator:80/pdf" '{url: $url, basicAuthToken: $token, requestTimeout: 120000}')"
              TASK_DOWNLOAD_TOKEN_JSON="$(jq -cn --arg jwt "$JWT_SECRET" '{jwtSecret: $jwt}')"
              TASK_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{user: $user, password: $password}')"
              TASK_BASIC_AUTH_JSON="$(jq -cn --arg token "$TASK_BASIC_TOKEN" --arg eventToken "$EVENT_TASK_TOKEN" '{tokens: [$token, $eventToken]}')"
              TASK_SYSTEM_NOTIFIER_JSON="$(jq -cn --arg user "$NOTIFY_LOGIN" --arg password "$NOTIFY_PASSWORD" '{email: {user: $user, password: $password}}')"
              # Task's cross-service ping (GET /test/ping/services) sends the manager and gateway monitoring tokens.
              TASK_PING_JSON="$(jq -cn --arg manager "$MONITORING_MANAGER_TOKEN" --arg gateway "$MONITORING_GATEWAY_TOKEN" '{manager: {monitoringToken: $manager}, gateway: {monitoringToken: $gateway}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "task") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$TASK_DB_JSON" \
                --from-literal=message_queue.json="$TASK_MQ_JSON" \
                --from-literal=auth.json="$TASK_AUTH_JSON" \
                --from-literal=register.json="$TASK_REGISTER_JSON" \
                --from-literal=external_reader.json="$TASK_EXTERNAL_READER_JSON" \
                --from-literal=filestorage.json="$TASK_FILESTORAGE_JSON" \
                --from-literal=storage.json="$TASK_STORAGE_JSON" \
                --from-literal=pdf_generator.json="$TASK_PDF_GENERATOR_JSON" \
                --from-literal=download_token.json="$TASK_DOWNLOAD_TOKEN_JSON" \
                --from-literal=notifier.json="$TASK_NOTIFIER_JSON" \
                --from-literal=system_notifier.json="$TASK_SYSTEM_NOTIFIER_JSON" \
                --from-literal=basic_auth.json="$TASK_BASIC_AUTH_JSON" \
                --from-literal=ping.json="$TASK_PING_JSON"

              PERSIST_LINK_PASSWORD="$(openssl rand -base64 32)"
              PERSIST_LINK_SECRETKEY="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
              PERSIST_LINK_CRYPTIV="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 16)"
              PERSIST_LINK_TOKEN="Basic $(printf "persist-link:%s" "$(openssl rand -base64 32)" | base64 | tr -d '\n')"
              TASK_PERSIST_LINK_JSON="$(jq -cn --arg token "$PERSIST_LINK_TOKEN" '{token: $token}')"
              EVENT_PERSIST_LINK_JSON="$(jq -cn --arg token "$PERSIST_LINK_TOKEN" '{token: $token}')"

              PERSIST_LINK_DB_JSON="$(jq -cn --arg password "$PERSIST_LINK_PASSWORD" '{password: $password}')"
              PERSIST_LINK_AUTH_JSON="$(jq -cn --arg token "$PERSIST_LINK_TOKEN" '{tokens: [$token]}')"
              PERSIST_LINK_LINK_GENERATOR_JSON="$(jq -cn --arg secretKey "$PERSIST_LINK_SECRETKEY" --arg cryptIv "$PERSIST_LINK_CRYPTIV" '{secretKey: $secretKey, cryptIv: $cryptIv}')"

              kubectl patch secret {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "task") }} \
                --namespace "$NAMESPACE" \
                --type merge \
                --patch "$(jq -cn --arg v "$(printf '%s' "$TASK_PERSIST_LINK_JSON" | base64 | tr -d '\n')" '{data: {"persist_link.json": $v}}')"

              kubectl patch secret {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") }} \
                --namespace "$NAMESPACE" \
                --type merge \
                --patch "$(jq -cn --arg v "$(printf '%s' "$EVENT_PERSIST_LINK_JSON" | base64 | tr -d '\n')" '{data: {"persist_link.json": $v}}')"

              kubectl create secret generic {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "persist-link") }} \
                --namespace "$NAMESPACE" \
                --from-literal=db.json="$PERSIST_LINK_DB_JSON" \
                --from-literal=auth.json="$PERSIST_LINK_AUTH_JSON" \
                --from-literal=link_generator.json="$PERSIST_LINK_LINK_GENERATOR_JSON"
---
# Upgrade path: the install hook above does not run on `helm upgrade`, and installs created before the default
# task Basic token was removed have no `basic_auth.json` (task) and `task.json` (admin-api) in their secrets.
# This hook adds the missing keys to the existing secrets and never overwrites or regenerates anything present.
#
# It also adds a Basic token for user `event` (task `basic_auth.json` tokens, event `external_bpmn.json` as `test.token`)
# unless the event Secret already has an `external_bpmn.json`, then restarts task and event. Re-running is a no-op.
#
# It also migrates releases created before the named id-api clients (KS-24) existed. For each of task, cabinet-api,
# event and notification: only when the id Secret's config.json has no `production.basic_auth.clients` entry with that
# name, it generates a client secret, writes the caller's `Basic base64(name:secret)` token into the caller Secret, and
# then merges the SHA-256 hash into the id Secret (caller first, so a failed run is retried in full). Existing clients
# are never touched, so re-running is a no-op. If anything was added, the id-api Deployment is restarted and awaited,
# then the caller Deployments are restarted (the services read their secrets at startup). The whole hook is rendered
# only when `secrets.createSecrets` is true; with `existingSecrets` it works on those Secrets, and with
# `createSecrets: false` it does not exist and the operator provisions clients and tokens (see the README).
#
# It also adds a monitoring token to manager, gateway and event (`server.json` `monitoring`, and manager's token in event's
# `ping.json`, and manager's and gateway's tokens in task's `ping.json`) where none is set, and keeps the plain tokens in the monitoring tokens Secret. It restarts what it changed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "task") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "admin-api") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "id") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "cabinet-api") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "notification") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "manager") | quote }}
      - {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "gateway") | quote }}
      - {{ include "liquio.monitoringSecret.name" . | quote }}
    verbs: ["get", "patch"]
  # Create the monitoring tokens Secret on releases that predate it (create cannot be limited by resourceNames).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Restart the id-api and caller Deployments after named id-api clients are added (they read secrets at startup).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ printf "%s-id-api" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-task" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-cabinet-api" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-event" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-notification" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-manager" (include "liquio.fullname" .) | quote }}
      - {{ printf "%s-gateway" (include "liquio.fullname" .) | quote }}
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "liquio.fullname" . }}-init-secrets-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    ignore-check.kube-linter.io/no-read-only-root-fs: "init-secrets-upgrade requires filesystem writes for apk add"
    ignore-check.kube-linter.io/run-as-non-root: "init-secrets-upgrade requires root to run apk add"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "liquio.labels" . | nindent 8 }}
        app.kubernetes.io/component: init-secrets-upgrade
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "liquio.fullname" . }}-init-secrets-upgrade
      containers:
        - name: init-secrets-upgrade
          image: alpine/k8s:1.34.7
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              apk add --no-cache openssl jq >/dev/null

              NAMESPACE={{ .Release.Namespace | quote }}
              TASK_SECRET={{ include "liquio.secretConfig.name" (dict "ctx" . "service" "task") | quote }}
              ADMIN_API_SECRET={{ include "liquio.secretConfig.name" (dict "ctx" . "service" "admin-api") | quote }}

              # Print a secret key value (empty when the secret or the key is missing). $2 is the escaped key name.
              secret_value() {
                kubectl get secret "$1" --namespace "$NAMESPACE" --ignore-not-found -o "jsonpath={.data.$2}" | base64 -d
              }

              # Add a secret key. $1 secret, $2 key, $3 JSON value.
              add_key() {
                kubectl patch secret "$1" --namespace "$NAMESPACE" --type merge \
                  --patch "$(jq -cn --arg k "$2" --arg v "$(printf '%s' "$3" | base64 | tr -d '\n')" '{data: {($k): $v}}')"
              }

              TASK_TOKEN="$(secret_value "$TASK_SECRET" 'basic_auth\.json' | jq -r '.tokens[0] // empty')"
              ADMIN_API_TOKEN="$(secret_value "$ADMIN_API_SECRET" 'task\.json' | jq -r '.token // empty')"

              # Reuse an existing token so task and admin-api always agree; generate one only when neither has it.
              TASK_BASIC_TOKEN="${TASK_TOKEN:-$ADMIN_API_TOKEN}"
              if [ -z "$TASK_BASIC_TOKEN" ]; then
                TASK_BASIC_TOKEN="Basic $(printf "admin-api:%s" "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')" | base64 | tr -d '\n')"
              fi

              if [ -z "$TASK_TOKEN" ]; then
                if kubectl get secret "$TASK_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                  add_key "$TASK_SECRET" basic_auth.json "$(jq -cn --arg token "$TASK_BASIC_TOKEN" '{tokens: [$token]}')"
                else
                  echo "Secret $TASK_SECRET not found, skipping basic_auth.json"
                fi
              fi

              if [ -z "$ADMIN_API_TOKEN" ]; then
                if kubectl get secret "$ADMIN_API_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                  add_key "$ADMIN_API_SECRET" task.json "$(jq -cn --arg token "$TASK_BASIC_TOKEN" '{token: $token}')"
                else
                  echo "Secret $ADMIN_API_SECRET not found, skipping task.json"
                fi
              fi

              # --- Basic token for event -> task (user `event`, external_bpmn.test) ---
              EVENT_SECRET={{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") | quote }}
              if kubectl get secret "$TASK_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1 && kubectl get secret "$EVENT_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                # Reuse the task token of user `event` when there is one, so a rerun after a partial run completes the pair.
                EVENT_TASK_TOKEN="$(secret_value "$TASK_SECRET" 'basic_auth\.json' | jq -r '[(.tokens // [])[] | select(type == "string" and ((sub("^Basic "; "") | @base64d? // "") | startswith("event:")))][0] // empty')"
                EVENT_BPMN="$(secret_value "$EVENT_SECRET" 'external_bpmn\.json')"
                # An existing event external_bpmn.json is operator-owned: leave it and the task tokens alone.
                if [ -z "$EVENT_BPMN" ]; then
                  if [ -z "$EVENT_TASK_TOKEN" ]; then
                    EVENT_TASK_TOKEN="Basic $(printf "event:%s" "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')" | base64 | tr -d '\n')"
                    # Task first, so a failed run leaves an unused token rather than an event token task rejects.
                    add_key "$TASK_SECRET" basic_auth.json "$(secret_value "$TASK_SECRET" 'basic_auth\.json' | jq -c --arg t "$EVENT_TASK_TOKEN" '.tokens = ((.tokens // []) + [$t])')"
                  fi
                  add_key "$EVENT_SECRET" external_bpmn.json "$(jq -cn --arg token "$EVENT_TASK_TOKEN" '{test: {token: $token}}')"
                  for d in {{ printf "%s-task" (include "liquio.fullname" .) | quote }} {{ printf "%s-event" (include "liquio.fullname" .) | quote }}; do
                    if kubectl get deployment "$d" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                      kubectl rollout restart deployment "$d" --namespace "$NAMESPACE"
                    fi
                  done
                  echo "Provisioned event task token"
                else
                  echo "Event external_bpmn.json already present, skipping event task token"
                fi
              else
                echo "Secret $TASK_SECRET or $EVENT_SECRET not found, skipping event task token"
              fi

              # --- Named id-api clients (KS-24) ---
              ID_SECRET={{ include "liquio.secretConfig.name" (dict "ctx" . "service" "id") | quote }}
              ID_DEPLOYMENT={{ printf "%s-id-api" (include "liquio.fullname" .) | quote }}
              CALLER_DEPLOYMENTS=""
              NEW_CLIENTS="[]"
              ID_CONFIG="$(secret_value "$ID_SECRET" 'config\.json')"

              # Mint a client when id has none by that name. $1 name, $2 caller Secret, $3 caller key (escaped for
              # jsonpath), $4 caller key (plain), $5 jq path of the token in the caller JSON, $6 scopes JSON, $7 Deployment.
              migrate_client() {
                if printf '%s' "$ID_CONFIG" | jq -e --arg n "$1" '(.production.basic_auth.clients // []) | any(.name == $n)' >/dev/null; then
                  echo "id client $1 already present, skipping"
                  return 0
                fi
                if ! kubectl get secret "$2" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                  echo "Secret $2 not found, skipping id client $1"
                  return 0
                fi
                CLIENT_SECRET="$(openssl rand -hex 32)"
                CALLER_JSON="$(secret_value "$2" "$3")"
                [ -n "$CALLER_JSON" ] || CALLER_JSON="{}"
                CALLER_JSON="$(printf '%s' "$CALLER_JSON" | jq -c --arg t "Basic $(printf '%s:%s' "$1" "$CLIENT_SECRET" | base64 | tr -d '\n')" "$5 = \$t")"
                add_key "$2" "$4" "$CALLER_JSON"
                NEW_CLIENTS="$(printf '%s' "$NEW_CLIENTS" | jq -c --arg n "$1" --arg h "$(printf '%s' "$CLIENT_SECRET" | openssl dgst -sha256 | awk '{print $NF}')" --argjson s "$6" '. + [{name: $n, secret_hash: $h, scopes: $s}]')"
                CALLER_DEPLOYMENTS="$CALLER_DEPLOYMENTS $7"
                echo "Provisioned id client $1"
              }

              if [ -z "$ID_CONFIG" ] || ! printf '%s' "$ID_CONFIG" | jq -e . >/dev/null 2>&1; then
                echo "Secret $ID_SECRET has no valid config.json, skipping named id clients"
              else
                migrate_client task {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "task") | quote }} 'auth\.json' auth.json '.LiquioId.basicAuthToken' '["user:read","user:write"]' {{ printf "%s-task" (include "liquio.fullname" .) | quote }}
                migrate_client cabinet-api {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "cabinet-api") | quote }} 'auth\.json' auth.json '.LiquioId.basicAuthToken' '["totp"]' {{ printf "%s-cabinet-api" (include "liquio.fullname" .) | quote }}
                migrate_client event {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") | quote }} 'user\.json' user.json '.LiquioId.basicAuthToken' '["user:read","user:write"]' {{ printf "%s-event" (include "liquio.fullname" .) | quote }}
                migrate_client notification {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "notification") | quote }} 'config\.json' config.json '.production.auth_server.basicAuthToken' '["user:read"]' {{ printf "%s-notification" (include "liquio.fullname" .) | quote }}

                if [ "$NEW_CLIENTS" != "[]" ]; then
                  add_key "$ID_SECRET" config.json "$(printf '%s' "$ID_CONFIG" | jq -c --argjson new "$NEW_CLIENTS" '.production.basic_auth.clients = ((.production.basic_auth.clients // []) + $new)')"
                  # Restart id-api first and wait, so the callers' new tokens are accepted when they come up.
                  if kubectl get deployment "$ID_DEPLOYMENT" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                    kubectl rollout restart deployment "$ID_DEPLOYMENT" --namespace "$NAMESPACE"
                    kubectl rollout status deployment "$ID_DEPLOYMENT" --namespace "$NAMESPACE" --timeout=300s
                  fi
                  for d in $CALLER_DEPLOYMENTS; do
                    if kubectl get deployment "$d" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                      kubectl rollout restart deployment "$d" --namespace "$NAMESPACE"
                    fi
                  done
                fi
              fi

              # --- Monitoring tokens (SE-3930 BM-08/GW-07/EV-09) ---
              # manager, gateway and event keep `server.monitoring` closed until a token is set. Add one per component to its
              # Secret's server.json, only where none is set, and (in event's ping.json) manager's token for event's
              # manager ping. An existing token or `isEnabled` is never changed. The plain tokens go to the monitoring tokens
              # Secret, created or completed key by key. Re-running is a no-op.
              MON_SECRET={{ include "liquio.monitoringSecret.name" . | quote }}
              MON_RESTART=""

              # Ensure the token of one component. $1 component, $2 its Secret, $3 its Deployment. Prints nothing; sets
              # MON_TOKEN_<component> through the variable named by $4.
              ensure_monitoring() {
                if ! kubectl get secret "$2" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                  echo "Secret $2 not found, skipping monitoring token for $1"
                  return 0
                fi
                CUR_SERVER="$(secret_value "$2" 'server\.json')"
                [ -n "$CUR_SERVER" ] || CUR_SERVER="{}"
                if ! printf '%s' "$CUR_SERVER" | jq -e 'type == "object"' >/dev/null 2>&1; then
                  echo "Secret $2 has an invalid server.json, skipping monitoring token for $1"
                  return 0
                fi
                TOK="$(printf '%s' "$CUR_SERVER" | jq -r '.monitoring.token // empty')"
                if [ -z "$TOK" ]; then
                  TOK="$(secret_value "$MON_SECRET" "$1")"
                  [ -n "$TOK" ] || TOK="$(openssl rand -hex 32)"
                  add_key "$2" server.json "$(printf '%s' "$CUR_SERVER" | jq -c --arg t "$TOK" '.monitoring = ((.monitoring // {}) | .token = $t | if has("isEnabled") then . else .isEnabled = true end)')"
                  MON_RESTART="$MON_RESTART $3"
                  echo "Provisioned monitoring token for $1"
                else
                  echo "Monitoring token for $1 already present, skipping"
                fi
                # Mirror the effective token into the tokens Secret when it has none for this component.
                if [ -z "$(secret_value "$MON_SECRET" "$1")" ]; then
                  if kubectl get secret "$MON_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                    kubectl patch secret "$MON_SECRET" --namespace "$NAMESPACE" --type merge \
                      --patch "$(jq -cn --arg k "$1" --arg v "$(printf '%s' "$TOK" | base64 | tr -d '\n')" '{data: {($k): $v}}')"
                  else
                    kubectl create secret generic "$MON_SECRET" --namespace "$NAMESPACE" --from-literal="$1=$TOK"
                  fi
                fi
                eval "MON_TOKEN_$1=\$TOK"
              }

              MON_TOKEN_manager=""
              MON_TOKEN_gateway=""
              ensure_monitoring manager {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "manager") | quote }} {{ printf "%s-manager" (include "liquio.fullname" .) | quote }}
              ensure_monitoring gateway {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "gateway") | quote }} {{ printf "%s-gateway" (include "liquio.fullname" .) | quote }}
              ensure_monitoring event {{ include "liquio.secretConfig.name" (dict "ctx" . "service" "event") | quote }} {{ printf "%s-event" (include "liquio.fullname" .) | quote }}

              # Event's ping to manager sends manager's token, unless event's ping.json already sets one.
              if [ -n "$MON_TOKEN_manager" ] && kubectl get secret "$EVENT_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                EVENT_PING="$(secret_value "$EVENT_SECRET" 'ping\.json')"
                [ -n "$EVENT_PING" ] || EVENT_PING="{}"
                if printf '%s' "$EVENT_PING" | jq -e 'type == "object" and ((.manager.monitoringToken // "") == "")' >/dev/null 2>&1; then
                  add_key "$EVENT_SECRET" ping.json "$(printf '%s' "$EVENT_PING" | jq -c --arg t "$MON_TOKEN_manager" '.manager = ((.manager // {}) | .monitoringToken = $t)')"
                  MON_RESTART="$MON_RESTART {{ printf "%s-event" (include "liquio.fullname" .) }}"
                  echo "Provisioned event ping token for manager"
                fi
              fi

              # Task's ping to manager and gateway sends their tokens (ping.json in the task Secret), each only where unset.
              if kubectl get secret "$TASK_SECRET" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                TASK_PING="$(secret_value "$TASK_SECRET" 'ping\.json')"
                [ -n "$TASK_PING" ] || TASK_PING="{}"
                if printf '%s' "$TASK_PING" | jq -e 'type == "object"' >/dev/null 2>&1; then
                  NEW_TASK_PING="$(printf '%s' "$TASK_PING" | jq -c --arg m "$MON_TOKEN_manager" --arg g "$MON_TOKEN_gateway" '
                    (if $m != "" and ((.manager.monitoringToken // "") == "") then .manager = ((.manager // {}) | .monitoringToken = $m) else . end)
                    | (if $g != "" and ((.gateway.monitoringToken // "") == "") then .gateway = ((.gateway // {}) | .monitoringToken = $g) else . end)')"
                  if [ "$NEW_TASK_PING" != "$(printf '%s' "$TASK_PING" | jq -c .)" ]; then
                    add_key "$TASK_SECRET" ping.json "$NEW_TASK_PING"
                    MON_RESTART="$MON_RESTART {{ printf "%s-task" (include "liquio.fullname" .) }}"
                    echo "Provisioned task ping tokens"
                  fi
                else
                  echo "Secret $TASK_SECRET has an invalid ping.json, skipping task ping tokens"
                fi
              fi

              for d in $(printf '%s\n' $MON_RESTART | sort -u); do
                if kubectl get deployment "$d" --namespace "$NAMESPACE" >/dev/null 2>&1; then
                  kubectl rollout restart deployment "$d" --namespace "$NAMESPACE"
                fi
              done
{{- end }}
