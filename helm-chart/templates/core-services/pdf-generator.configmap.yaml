apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ include "liquio.namespace" . }}
  name: {{ include "liquio.fullname" . }}-pdf-generator-config
  labels:
    {{- include "liquio.labels" . | nindent 4 }}
{{ $serverBase := dict
  "port" (default 8080 .Values.services.pdfGenerator.containerPort)
  "bodyLimit" "50mb"
  "defaultBodyLimit" "100kb"
}}
{{- /* noSandbox true: the pod uses RuntimeDefault seccomp, which blocks the user namespaces Chromium's sandbox needs. */ -}}
{{- /* Override with config.pdfGenerator.playwright.noSandbox=false once the pod allows them (see components/pdf-generator/README.md). */ -}}
{{ $playwrightBase := dict
  "workerTimeout" 30000
  "maxWorkers" 5
  "maxConcurrentJobs" 200
  "maxQueueSize" 100
  "allowedHosts" (list)
  "noSandbox" true
}}
data:
  # Server configuration
  server.json: |
{{ include "liquio.renderJsonConfig" (dict "ctx" . "service" "pdfGenerator" "config" "server.json" "base" $serverBase) | nindent 4 }}

  # Playwright worker configuration
  playwright.json: |
{{ include "liquio.renderJsonConfig" (dict "ctx" . "service" "pdfGenerator" "config" "playwright.json" "base" $playwrightBase) | nindent 4 }}
